<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生成 App 图标</title>
  <style>
    body {
      font-family: "YouYuan", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f7f5f0;
      text-align: center;
      padding: 40px 20px;
    }
    h1 { color: #6c5ce7; margin-bottom: 8px; }
    p { color: #8c8c8c; margin-bottom: 24px; }
    canvas { border-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); margin: 10px; }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: #6c5ce7;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin: 10px;
      font-family: inherit;
    }
    .btn:active { background: #5a4bd1; }
    .hint { font-size: 13px; color: #8c8c8c; margin-top: 16px; }
  </style>
</head>
<body>

  <h1>🎨 App 图标生成器</h1>
  <p>点击按钮下载图标，将下载的文件放到 accounting-app 文件夹中</p>

  <canvas id="icon192" width="192" height="192"></canvas>
  <canvas id="icon512" width="512" height="512"></canvas>

  <div>
    <button class="btn" onclick="downloadIcon(192)">⬇ 下载 192×192 图标</button>
    <button class="btn" onclick="downloadIcon(512)">⬇ 下载 512×512 图标</button>
  </div>
  <div class="hint">
    下载后放到 <code>accounting-app</code> 文件夹里，命名必须为 <code>icon-192.png</code> 和 <code>icon-512.png</code>
  </div>

  <script>
    /**
     * 生成记账App图标（圆形紫色底 + 💰emoji + 圆角效果）
     */
    function drawIcon(size) {
      const canvas = document.getElementById("icon" + size);
      const ctx = canvas.getContext("2d");

      // 缩放上下文以适配高DPI（确保图标清晰）
      const dpr = window.devicePixelRatio || 1;
      canvas.width = size * dpr;
      canvas.height = size * dpr;
      canvas.style.width = size + "px";
      canvas.style.height = size + "px";
      ctx.scale(dpr, dpr);

      // 背景：紫色圆角方块
      const pad = size * 0.1;
      const radius = size * 0.22;
      roundRect(ctx, pad, pad, size - pad * 2, size - pad * 2, radius);
      ctx.fillStyle = "#6c5ce7";
      ctx.fill();

      // 白色内圈（让图标更立体）
      const innerPad = size * 0.18;
      const innerRadius = size * 0.18;
      roundRect(ctx, innerPad, innerPad, size - innerPad * 2, size - innerPad * 2, innerRadius);
      ctx.fillStyle = "#ffffff";
      ctx.fill();

      // 💰 emoji
      const emojiSize = size * 0.45;
      ctx.font = emojiSize + "px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("💰", size / 2, size / 2);
    }

    // 绘制圆角矩形
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    // 下载图标
    function downloadIcon(size) {
      const canvas = document.getElementById("icon" + size);
      const link = document.createElement("a");
      link.download = "icon-" + size + ".png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    // 页面加载时绘制图标
    drawIcon(192);
    drawIcon(512);
  </script>
</body>
</html>
